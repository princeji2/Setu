<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setu — one login, three departments, verified through a gateway</title>
<meta name="description" content="Setu is a consent-based interoperability gateway linking Digital Tax Records, the National Identity Registry and the Driving Licence & Jan Aadhaar Portal behind a single citizen login.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- "Corporate Trust" pairing (verified via ui-ux-pro-max-full for
     earthy/editorial palette from the design-system reference: Fraunces
     (serif) for headlines/display, Sora (sans) for body. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/chatbot.css">
<!-- Gateway API base. Runs before the app module (js/api.js reads this).
     Leave unset/blank for local dev — the client falls back to
     http://localhost:4000/api/v1. For a deployed frontend, set it to the
     deployed gateway URL, e.g.
       window.SETU_API_BASE = 'https://setu-gateway.onrender.com/api/v1';
     Keep the trailing '/api/v1' and no trailing slash. -->
<script>
  window.SETU_API_BASE = (['localhost', '127.0.0.1'].includes(window.location.hostname))
    ? 'http://localhost:4000/api/v1'
    : 'https://setu-gateway.onrender.com/api/v1';
</script>
</head>
<body>
  <div id="appRoot"></div>
  <!-- Vendored locally so the demo has zero external network dependency
       (see js/vendor/README.md). Used only for the relay centerpiece
       reveal, per tech.md — not decorative elsewhere. Classic script (not
       a module) so it attaches window.gsap for relay.js to read. -->
  <script src="/js/vendor/gsap.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
